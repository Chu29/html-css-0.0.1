<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css">
  <title>WhiteSpace SaaS</title>
</head>

<body>
  <div id="app">

    <header>

      <img src="assets/logo/Logo.svg" alt="whitespace saas logo">

      <nav>

        <div class="nav-menu">
          <ul>
            <li>
              <a href="#">Products</a>
              <img src="assets/icons/Down Arrow.svg" alt="drop down icon">
            </li>
            <li>
              <a href="#">Solutions</a>
              <img src="assets/icons/Down Arrow.svg" alt="drop down icon">
            </li>
            <li>
              <a href="#">Resources</a>
              <img src="assets/icons/Down Arrow.svg" alt="drop down icon">
            </li>
            <li>
              <a href="#">Pricing</a>
              <img src="assets/icons/Down Arrow.svg" alt="drop down icon">
            </li>
          </ul>
        </div>

        <div class="nav-btn">
          <button class="btn-login">Login</button>
          <button class="btn-free-trial">
            Try WhiteSpace free
            <img src="assets/icons/Icon-Arrow.svg" alt="free trial button">
          </button>
        </div>

      </nav>
    </header>

    <section id="hero">

      <div class="hero-left">
        <h2>Get More Done with WhiteSpace</h2>
        <p>
          Project management software that enables your teams to collaborate, plan, analyze and manage everyday tasks
        </p>
        <button class="btn-free-trial">
          Try WhiteSpace free
          <img src="assets/icons/Icon-Arrow.svg" alt="free trial button">
        </button>
      </div>

      <img src="assets/images/Image-container.jpg" alt="ad">

    </section>

  </div>
</body>

</html>
